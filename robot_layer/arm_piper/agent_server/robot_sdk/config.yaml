# ----------------------------------------------------------
# ROS topics and coordinate frames
# ----------------------------------------------------------
ros:
  # Color image topic (sensor_msgs/Image).
  image_topic: "/table_camera/color/image_raw"

  # Depth image topic aligned to the color image (sensor_msgs/Image).
  depth_topic: "/table_camera/aligned_depth_to_color/image_raw"

  # Camera intrinsics topic (sensor_msgs/CameraInfo).
  camera_info_topic: "/table_camera/color/camera_info"

  # Camera optical frame_id. ROS TF must provide base_link <- table_camera_color_optical_frame.
  camera_frame_id: "table_camera_color_optical_frame"

  # Robot base frame_id.
  base_frame_id: "base_link"

  # Piper joint state topic (sensor_msgs/JointState).
  joint_state_topic: "/joint_states_single"

  # Piper end-effector pose topic (geometry_msgs/PoseStamped).
  end_pose_topic: "/end_pose"

# ----------------------------------------------------------
# Camera configuration
# ----------------------------------------------------------
cameras:
  # Camera name to ROS topic mapping.
  # The SDK uses standard internal names: cam_high, cam_low, cam_left_wrist, cam_right_wrist.
  # alias is the readable camera name returned by the HTTP API; if omitted, it defaults to the camera name.
  cam_high:
    topic: "/left_camera/color/image_raw"
    alias: "left_camera_0_left"
    enabled: false

  cam_low:
    topic: "/table_camera/color/image_raw"
    alias: "table_camera"
    enabled: true

  cam_left_wrist:
    topic: "/cam_left_wrist"
    enabled: false

  cam_right_wrist:
    topic: "/cam_right_wrist"
    enabled: false

# ----------------------------------------------------------
# YOLO object detection service
# ----------------------------------------------------------
yolo:
  # Remote YOLO HTTP detection endpoint.
  url: "http://192.168.1.104:8013/detect"

  # Confidence threshold.
  conf_thres: 0.5

  # NMS IoU threshold.
  iou_thres: 0.45

  # HTTP request timeout in seconds.
  request_timeout: 10.0

  # Timeout in seconds while waiting for the first image frame.
  start_timeout: 30.0

# ----------------------------------------------------------
# GraspAnything grasp detection service (HTTP API)
# ----------------------------------------------------------
grasp:
  # Remote GraspAnything HTTP detection endpoint.
  url: "http://192.168.1.104:8015/grasp/detect"

  # Confidence threshold.
  conf_thres: 0.5

  # NMS IoU threshold.
  iou_thres: 0.45

  # HTTP request timeout in seconds.
  request_timeout: 10.0

  # Timeout in seconds while waiting for the first image frame.
  start_timeout: 30.0

# ----------------------------------------------------------
# Piper robot arm
# ----------------------------------------------------------
piper:
  # ROS environment setup.bash path.
  setup_bash: "/root/ABot-Claw/robot_layer/arm_piper/agent_server/robot_driver_ros/devel/setup.bash"

  # MoveIt default velocity and acceleration scaling factors (0 to 1).
  max_velocity: 0.5
  max_acceleration: 0.5

  # Reset joint angles in radians for the 6 arm joints.
  reset_joints: [0.0, 0.08, -0.32, -0.02, 1.06, -0.034]

  # Reset gripper opening in meters.
  reset_gripper: 0.059

  # Number of arm joints.
  num_joints: 6

  # Gripper travel range in meters.
  gripper_min: 0.0
  gripper_max: 0.06

# ----------------------------------------------------------
# Spatial Memory Hub service
# ----------------------------------------------------------
spatial_memory:
  # Service endpoint.
  url: "http://192.168.1.104:8012"

  # HTTP request timeout in seconds.
  request_timeout: 10.0
